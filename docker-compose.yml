services:
  # db:
  #   image: postgres:16-alpine
  #   env_file: .env
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     # Host:container — HOST vem de POSTGRES_HOST_PORT pra permitir
  #     # múltiplos projetos Postgres na mesma máquina sem colisão. A porta
  #     # do container continua POSTGRES_PORT (o que o Rails conecta via DNS).
  #     - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
  #   healthcheck:
  #     # $$ escapa a interpolação do compose pra variável resolver no shell
  #     # do container.
  #     test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  banco-uso-hugo:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data_hugo:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: development
    env_file: .env
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bundle install &&
               bin/rails db:prepare &&
               bin/rails server -b 0.0.0.0 -p ${PORT}"

volumes:
  postgres_data:
  postgres_data_hugo:
  bundle_cache:
